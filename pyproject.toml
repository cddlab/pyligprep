[project]
name = "pyligprep"
version = "0.0.2"
description = "GPU-accelerated ligand preparation toolkit for molecular simulations"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.14",
  "h5py>=3.10",
  "pyscf>=2.12",
  # D3BJ dispersion: pyscf-dispersion publishes Linux wheels only (no macOS arm64 wheel or sdist).
  # On macOS, simple-dftd3's Python API (dftd3) provides the same D3(BJ) model.
  "pyscf-dispersion>=1.3; sys_platform == 'linux'",
  "dftd3>=1.2; sys_platform == 'darwin'",
  "rdkit>=2025.9.4",
  "geometric>=1.1.1",
  "pyberny==0.7.0",
  # `hadd` without --smiles/--template: bond orders are perceived from the heavy-atom PDB geometry.
  # Open Babel is GPL-2.0-only (incompatible with GPL-3.0): its bundled `obabel` program is run as a separate
  # process (chemistry.obabel_command); the Python bindings are never imported.
  "openbabel-wheel==3.1.1.23",
]
authors = [
  {name = "Yoshitaka Moriwaki", email = "moriwaki.yoshitaka@tmd.ac.jp"},
]

[project.optional-dependencies]
cuda12 = [
  "gpu4pyscf-cuda12x==1.9.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "cupy-cuda12x==13.4.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "cutensor-cu12==2.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "gpu4pyscf-libxc-cuda12x==0.9.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
pyligprep = "pyligprep.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1",
       "ruff>=0.16.5",
       "f90nml>=1.4",
       "ty>=0.0.89",
       ]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*Jupyter is migrating.*:DeprecationWarning",
]
addopts = "-ra"
markers = ["gpu: requires a Slurm GPU allocation", "amber: requires AmberTools 26", "reference: compares against installed PyRESP"]

# macOS: build PySCF from source with OpenMP. PyPI's macOS wheels are built without OpenMP (--threads has
# no effect), and Apple clang has no OpenMP, so the build uses Homebrew LLVM (`brew install llvm`).
# The GitHub release archive is used because the PyPI 2.15.0 sdist lacks libxcfun.patch and fails to build.
# Linux keeps the PyPI wheel. These settings are read by uv only (pip installs the wheel without OpenMP).
[tool.uv.sources]
pyscf = { url = "https://github.com/pyscf/pyscf/archive/refs/tags/v2.15.0.tar.gz", marker = "sys_platform == 'darwin'" }

[tool.uv.extra-build-variables]
pyscf = { CC = "/opt/homebrew/opt/llvm/bin/clang", CXX = "/opt/homebrew/opt/llvm/bin/clang++", CMAKE_BUILD_PARALLEL_LEVEL = "8" }

[tool.ty.analysis]
# Platform-specific optional modules: GPU packages (Linux cuda12 extra) and pyscf-dispersion (Linux only;
# macOS uses the dftd3 shim registered under the same name at runtime).
allowed-unresolved-imports = ["cupy", "gpu4pyscf", "gpu4pyscf.**", "pyscf.dispersion", "pyscf.dispersion.**"]

[tool.ruff]
indent-width = 2
line-length = 120 # Same as Black.
exclude = [".ruff_cache", ".ruff.toml", ".ruff.lock"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "F", # Flake8
    "B", # Black
    "I", # isort
    "E", # error
    "W", # warning
    "TID", # flake8-tidy-imports (absolute imports only)
]
ignore = ["F401", "E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses used as immutable argument defaults (B008).
extend-immutable-calls = [
    "pyligprep.charges.RespOptions",
    "pyligprep.optimization.OptimizationOptions",
    "pyligprep.quantum.QuantumOptions",
]

[tool.ruff.lint.flake8-tidy-imports]
# Import package modules as `pyligprep.<module>`, never with relative `.` imports.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
combine-as-imports = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"

[project.urls]
Homepage = "https://github.com/cddlab/pyligprep"
Issues = "https://github.com/cddlab/pyligprep/issues"